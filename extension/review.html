<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review cards · Phrasebound</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <main>
    <header>
      <h1>Review cards</h1>
      <p id="review-counts" role="status">Loading your deck…</p>
    </header>
    <section class="card" aria-label="Current card" id="review-card">
      <h2 id="review-word"></h2>
      <p id="review-line" class="line" hidden></p>
      <button type="button" id="review-reveal" hidden>Show answer <kbd>Space</kbd></button>
      <div id="review-answer" hidden>
        <p id="review-reading"></p>
        <p id="review-meaning"></p>
        <p id="review-context"></p>
        <a id="review-source" target="_blank" rel="noopener noreferrer" hidden>Open source ↗</a>
        <div id="review-ratings" aria-label="Rate your recall">
          <button type="button" data-grade="again" title="I forgot or answered incorrectly">Again <kbd>1</kbd><small></small></button>
          <button type="button" data-grade="hard" title="I recalled it with difficulty">Hard <kbd>2</kbd><small></small></button>
          <button type="button" data-grade="good" title="I recalled it correctly">Good <kbd>3</kbd><small></small></button>
          <button type="button" data-grade="easy" title="I recalled it immediately">Easy <kbd>4</kbd><small></small></button>
        </div>
      </div>
      <p id="review-message" role="status"></p>
    </section>
    <div class="tools">
      <button type="button" id="review-undo" hidden>Undo last rating</button>
      <details>
        <summary>Review settings</summary>
        <form id="review-settings">
          <label>Desired recall (%) <input id="review-retention" type="number" min="80" max="98" step="1" required></label>
          <label>New cards per day <input id="review-limit" type="number" min="0" max="100" step="1" required></label>
          <button type="submit">Save settings</button>
        </form>
      </details>
    </div>
    <details id="sense-memory"><summary>Practise meanings from your history</summary><p role="status"></p><div></div></details>
    <section id="transfer-panel" aria-label="One-week scene review" hidden></section>
    <details id="highlight-history"><summary>Highlight history</summary>
      <label><input type="checkbox"> Remember webpage selections</label>
      <input type="search" aria-label="Search highlights" placeholder="Search words, passages, or sources">
      <button type="button">Forget all highlights</button><p role="status"></p><ul></ul>
    </details>
    <details id="patterns">
      <summary>Japanese patterns and expressions</summary>
      <label for="pattern-query">Search by Japanese spelling or reading</label>
      <input id="pattern-query" type="search" autocomplete="off" placeholder="わけにはいかない">
      <p id="pattern-count" role="status"></p>
      <ul id="pattern-results"></ul>
      <button type="button" id="pattern-more" hidden>Show more</button>
      <p class="credit">Tsutsuji 1.1 by Shun Matsuyoshi and Satoshi Sato.
        <a href="credits.html#tsutsuji" target="_blank">Source and license</a>
      </p>
    </details>
  </main>
  <script src="storage.js"></script>
  <script src="transfer.js"></script>
  <script src="sense-memory.js"></script>
  <script src="transfer-review.js"></script>
  <script src="highlight-review.js"></script>
  <script src="review.js"></script>
</body>
</html>
