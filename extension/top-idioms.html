<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Most-heard idioms · Phrasebound</title>
  <link rel="stylesheet" href="top-idioms.css">
  <script src="top-idioms.js" defer></script>
</head>
<body>
  <main class="ti">
    <h1>Most-heard idioms</h1>
    <div class="ti-controls">
      <label class="ti-lang">Language <select id="lang"></select></label>
      <label class="ti-filter" id="playWrap" hidden><input type="checkbox" id="playOnly"> <span id="playLbl">Playful only</span></label>
    </div>
    <p id="stat" class="ti-stat"></p>
    <p class="ti-note">Ranked by how often each expression is said in YouTube videos (captions and on-screen subtitles, counted per million <span id="unit">words</span>). Films and TV are shown for comparison. Counts include some literal uses.</p>
    <ol id="list" class="ti-list"></ol>
    <button type="button" id="more" class="ti-more">Show 100 more</button>
  </main>
</body>
</html>
